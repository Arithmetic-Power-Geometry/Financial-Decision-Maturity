name: FDM Reproducibility

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Unit tests
        run: pytest -q

      - name: Run reproducible benchmark
        run: python experiments/run_benchmark.py

      - name: Run robustness and stress suite
        run: python experiments/run_stress_tests.py

      - name: Verify outputs
        run: |
          test -s results/session_results.csv
          test -s results/summary.csv
          test -s results/summary.json
          test -s results/stress_session_results.csv
          test -s results/stress_summary.csv
          test -s results/stress_summary.json
          test -s figures/cost_by_policy.png
          test -s figures/decision_accuracy_by_policy.png

      - name: Upload reproducibility artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: fdm-reproducibility-artifact
          path: |
            results/
            figures/
          if-no-files-found: error
